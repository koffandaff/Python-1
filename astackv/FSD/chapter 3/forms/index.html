<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="submit.html" method="get">
      <fieldset>
        <legend>Information</legend>
        <label for="uname"> Uname</label>
        <input
          type="text"
          id="uname"
          name="un"
          autofocus
          autocomplete="on"
          required
          placeholder="Username"
          maxlength="20"
          minlength="3"
        /><br /><br />
        <label>Email</label>
        <input type="email" name="email" required value="abc@xyz.com" />
        <br /><br />
        <label>password</label>
        <input
          type="password"
          name="password"
          placeholder="abc@123"
          minlength="7"
          maxlength="12"
          required
        /><br /><br />
        <label>Contact No.</label>
        <input
          type="text"
          name="contact no."
          placeholder="9999999999"
          required
        /><br /><br />
        <label>Gender</label>
        <input type="radio" name="gender" value="male" checked />Male
        <input type="radio" name="gender" value="female" />Female <br /><br />
        <label><b>Skills</b></label>
        <input type="checkbox" name="skills" value="Python" checked />Python
        <input type="checkbox" name="skills" value="Java" />Java
        <input type="checkbox" name="skills" value="UI/UX" />UI/UX
        <input type="checkbox" name="skills" value="MERN" />MERN<br /><br />
      </fieldset>
      <br /><br />

      <fieldset>
        <legend>Readonly,disabled,hidden</legend>
        <input type="text" value="Readonly" readonly name="ro" />
        <input type="text" name="promo" value="LJUID" disabled />
        <input type="hidden" name="uid" value="1234" />
      </fieldset>
      <br /><br />

      <fieldset>
        <legend>Additional Information</legend>
        <label>DOB</label>
        <input
          type="date"
          name="DOB"
          min="2005-09-24"
          max="2025-12-31"
        /><br /><br />
        <label>Age</label>
        <input
          type="number"
          name="age"
          min="1"
          max="30"
          step="1"
          value="14"
        /><br /><br />
        <label>Select Colour</label>
        <input type="color" name="cl" value="#000000" /><br /><br />
        <label>Message</label>
        <textarea
          name="msg"
          rows="10"
          cols="20"
          placeholder="Enter your messsage here"
          value="Hello Tell me your Problem!"
        ></textarea
        ><br /><br />
        <label>Select Branch</label>
        <select name="Branch">
          <option value="select" selected>Branch</option>
          <optgroup label="computer">
            <option value="cse" selected>CSE</option>
            <option value="ce">CE</option>
          </optgroup>
          <optgroup label="Other">
            <option value="mechanical">Mechanical</option>
            <option value="ec">EC</option>
          </optgroup>
        </select>
        <br /><br />
        <label>Preferred Browser</label>
        <input list="browsers" name="browsers" />
        <datalist id="browsers">
          <option value="Chrome"></option>
          <option value="Firefox"></option>
          <option value="Safari"></option>
        </datalist>
        <label>Price</label>
        <input
          type="range"
          min="100"
          max="5000"
          step="50"
          value="200"
          name="price"
        />
      </fieldset>
      <br /><br />
      

      <fieldset>
        <legend>Submit</legend>
        <input type="submit" value="submit form" />
        <input type="reset" value="reset" />
      </fieldset>
    </form>
  </body>
</html>
