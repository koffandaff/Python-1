<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Form</title>
</head>
<body>
    <form action="#" method="get">
        <fieldset>
            <legend>Information</legend>
            <label for="uname">Username</label>
            <input type="text" id="uname" name="un" autofocus="" autocomplete="on" required="" placeholder="User name" maxlength="12" minlength="4"/>
        </fieldset>

    </form>
</body>
</html>
